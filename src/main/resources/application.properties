spring.application.name=ordexxa-api-gateway
server.port=${GATEWAY_PORT:8080}

# Ruta pública de autenticación
spring.cloud.gateway.server.webflux.routes[0].id=ordexxa-auth-public
spring.cloud.gateway.server.webflux.routes[0].uri=${BACKEND_BASE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].order=-300
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# Ruta normal hacia backend
spring.cloud.gateway.server.webflux.routes[1].id=ordexxa-backend
spring.cloud.gateway.server.webflux.routes[1].uri=${BACKEND_BASE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[1].order=0
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/**

# Ruta del frontend construido con Vite Preview para local
spring.cloud.gateway.server.webflux.routes[2].id=ordexxa-frontend
spring.cloud.gateway.server.webflux.routes[2].uri=${FRONTEND_BASE_URL:http://localhost:4173}
spring.cloud.gateway.server.webflux.routes[2].order=100
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/**

# Headers de seguridad globales
spring.cloud.gateway.server.webflux.default-filters[0]=AddResponseHeader=X-Content-Type-Options,nosniff
spring.cloud.gateway.server.webflux.default-filters[1]=AddResponseHeader=X-Frame-Options,DENY
spring.cloud.gateway.server.webflux.default-filters[2]=AddResponseHeader=Referrer-Policy,no-referrer
spring.cloud.gateway.server.webflux.default-filters[3]=AddResponseHeader=Content-Security-Policy,default-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'
